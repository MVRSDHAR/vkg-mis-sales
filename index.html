<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VKG Sales &amp; Collections MIS — Lite</title>
<style>
  :root {
    --amber: #b45309; --amber-bg: #fef3c7;
    --teal: #0f766e; --teal-bg: #ccfbf1;
    --emerald: #047857; --emerald-bg: #d1fae5;
    --stone: #44403c; --stone-bg: #f5f5f4; --stone-border:#e7e5e4;
    --red: #dc2626; --red-bg:#fee2e2;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--stone-bg); color:#1c1917; }
  header { background:#1c1917; color:#fafaf9; padding:16px; }
  header .row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; max-width:900px; margin:0 auto; }
  header h1 { font-size:18px; margin:0; }
  header p { margin:2px 0 0; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#fbbf24; }
  .role-select { display:flex; align-items:center; gap:6px; font-size:12px; color:#d6d3d1; }
  select, input, textarea { font-family:inherit; font-size:14px; padding:8px; border-radius:8px; border:1px solid #d6d3d1; width:100%; background:white; }
  .bar { background:white; border-bottom:1px solid var(--stone-border); position:sticky; top:0; z-index:5; }
  .bar .row { max-width:900px; margin:0 auto; padding:0 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .tabs { display:flex; gap:2px; overflow-x:auto; }
  .tab-btn { padding:12px 16px; background:none; border:none; border-bottom:3px solid transparent; font-size:14px; font-weight:600; color:#78716c; cursor:pointer; white-space:nowrap; }
  .tab-btn.active.sales { border-color:var(--amber); color:var(--amber); }
  .tab-btn.active.collection { border-color:var(--emerald); color:var(--emerald); }
  .tab-btn.active.summary { border-color:var(--teal); color:var(--teal); }
  main { max-width:900px; margin:0 auto; padding:16px; padding-bottom:60px; }
  .card { background:white; border:1px solid var(--stone-border); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0 16px; }
  @media (max-width:600px){ .grid{ grid-template-columns:1fr; } }
  label { display:block; margin-bottom:12px; }
  label span.lbl { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#78716c; margin-bottom:4px; }
  .pill-row { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .pill { padding:7px 14px; border-radius:999px; border:1px solid #d6d3d1; background:white; font-size:13px; font-weight:600; cursor:pointer; color:#57534e; }
  .pill.active.amber { background:var(--amber); border-color:var(--amber); color:white; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:10px 18px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; color:white; }
  .btn.amber { background:var(--amber); } .btn.amber:hover{ background:#92400e; }
  .btn.emerald { background:var(--emerald); } .btn.emerald:hover{ background:#065f46; }
  .btn.ghost { background:white; color:#57534e; border:1px solid #d6d3d1; }
  .stat-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px; }
  @media(min-width:600px){ .stat-row{ grid-template-columns:repeat(4,1fr); } }
  .stat { background:white; border:1px solid var(--stone-border); border-radius:10px; padding:12px; border-top:4px solid var(--stone); }
  .stat.amber{ border-top-color:var(--amber); } .stat.teal{ border-top-color:var(--teal); } .stat.emerald{ border-top-color:var(--emerald); } .stat.red{ border-top-color:var(--red); }
  .stat .lbl { font-size:10px; text-transform:uppercase; color:#78716c; letter-spacing:0.5px; }
  .stat .val { font-family:ui-monospace,monospace; font-weight:700; font-size:16px; margin-top:2px; }
  table { width:100%; border-collapse:collapse; font-size:13px; background:white; }
  th { text-align:left; padding:8px; background:var(--stone-bg); font-size:10px; text-transform:uppercase; color:#78716c; letter-spacing:0.5px; }
  td { padding:8px; border-top:1px solid var(--stone-border); }
  td.num { text-align:right; font-family:ui-monospace,monospace; }
  .table-wrap { overflow-x:auto; border:1px solid var(--stone-border); border-radius:12px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .badge.stone{ background:var(--stone-bg); color:#57534e; } .badge.amber{ background:var(--amber-bg); color:var(--amber); }
  .badge.teal{ background:var(--teal-bg); color:var(--teal); } .badge.emerald{ background:var(--emerald-bg); color:var(--emerald); } .badge.red{ background:var(--red-bg); color:var(--red); }
  .actions { display:flex; gap:8px; justify-content:flex-end; }
  .icon-btn { background:none; border:none; cursor:pointer; font-size:15px; color:#a8a29e; padding:2px; }
  .icon-btn:hover { color:#44403c; }
  .icon-btn.danger:hover { color:var(--red); }
  .empty { text-align:center; color:#a8a29e; padding:24px; }
  .toast { position:fixed; bottom:16px; right:16px; background:#1c1917; color:white; padding:10px 16px; border-radius:8px; font-size:13px; z-index:50; }
  .hint { font-size:12px; color:#a8a29e; margin-top:8px; }
  .section-title { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; color:#57534e; margin:0 0 10px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>
<body>

<header>
  <div class="row">
    <div>
      <h1>VKG Sales &amp; Collections MIS <span style="font-weight:400;font-size:13px;color:#a8a29e;">(Lite)</span></h1>
      <p>Sales · Collection</p>
    </div>
    <div class="role-select" id="userBadge" style="display:none;">
      <span id="userRoleLabel"></span>
      <button type="button" onclick="doLogout()" style="margin-left:8px;background:none;border:1px solid #57534e;color:#d6d3d1;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;">Log out</button>
    </div>
  </div>

<div class="bar" id="tabBar" style="display:none;">

    <div class="tabs">

      <button class="tab-btn collection" id="tabBtn-collection" onclick="setTab('collection')">Collections</button>

    <input type="month" id="monthPicker" onchange="setMonth(this.value)" style="width:auto;">

<div id="loginScreen" style="max-width:360px;margin:60px auto;padding:0 16px;">
  <div class="card">
    <div class="section-title">Sign in</div>
    <label><span class="lbl">Email</span><input type="email" id="loginEmail" placeholder="you@vkg.internal"></label>
    <label><span class="lbl">Password</span><input type="password" id="loginPassword"></label>
    <div id="loginError" style="color:var(--red);font-size:13px;margin-bottom:10px;display:none;"></div>
    <button class="btn amber" type="button" onclick="doLogin()" style="width:100%;justify-content:center;">Sign in</button>
    <div style="text-align:center;margin-top:10px;">
      <a href="#" onclick="showForgotForm();return false;" style="font-size:13px;color:#b45309;">Forgot password?</a>
    </div>
  </div>
</div>

<div id="forgotScreen" style="max-width:360px;margin:60px auto;padding:0 16px;display:none;">
  <div class="card">
    <div class="section-title">Reset password</div>
    <p style="font-size:13px;color:#78716c;margin-bottom:10px;">Enter your login email — we'll send a reset link to it.</p>
    <label><span class="lbl">Email</span><input type="email" id="forgotEmail" placeholder="you@vkg.internal"></label>
    <div id="forgotMsg" style="font-size:13px;margin-bottom:10px;display:none;"></div>
    <button class="btn amber" type="button" onclick="doForgotPassword()" style="width:100%;justify-content:center;">Send reset link</button>
    <div style="text-align:center;margin-top:10px;">
      <a href="#" onclick="showLoginForm();return false;" style="font-size:13px;color:#b45309;">Back to sign in</a>
    </div>
  </div>
</div>

<div id="resetScreen" style="max-width:360px;margin:60px auto;padding:0 16px;display:none;">
  <div class="card">
    <div class="section-title">Set new password</div>
    <label><span class="lbl">New password</span><input type="password" id="newPassword"></label>
    <div id="resetMsg" style="font-size:13px;margin-bottom:10px;display:none;"></div>
    <button class="btn amber" type="button" onclick="doSetNewPassword()" style="width:100%;justify-content:center;">Save new password</button>
  </div>
</div>

<main id="app"></main>
<div id="toast" style="display:none;" class="toast"></div>

<datalist id="customerList"></datalist>
<datalist id="massIdList"></datalist>


<script>
// ---------- storage helpers ----------
const KEYS = { MASTER:'lite-sales-master', SALES:'lite-sales-sales', COLLECTION:'lite-sales-collection', TARGET:'lite-sales-target' };
// ---- Supabase connection (same project as the Production app — different key names, no clash) ----
const SUPABASE_URL = 'https://kfalpjblwfhlcqmxbwkc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LtkaUUlFOJ1DYCq4J1jXSA_63dmARUe';
if (typeof window.supabase === 'undefined'){
  document.body.innerHTML = '<div style="padding:24px;color:red;font-family:sans-serif;">ERROR: The Supabase library did not load. Check your internet connection and reload the page.</div>';
  throw new Error('Supabase library missing');
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadKey(key, fallback){
  try {
    if (key === PRODUCTION_MASSTARGETS_KEY){
      const { data, error } = await sb.from('production_mass_targets').select('*').order('month');
      if (error) throw error;
      return data.map(t => ({
        id: t.id, month: t.month, massId: t.mass_id, pitId: t.pit_id || '',
        managerName: t.manager_name || '', volumeCBM: t.volume_cbm ?? '', customerName: t.customer_name || ''
      }));
    }
    if (key === KEYS.MASTER){
      const { data, error } = await sb.from('sales_masters').select('type,value');
      if (error) throw error;
      return {
        customers: data.filter(r=>r.type==='customer').map(r=>r.value),
        massIds: data.filter(r=>r.type==='mass_id').map(r=>r.value)
      };
    }
    if (key === KEYS.SALES){
      const { data, error } = await sb.from('sales_entries').select('*').order('sale_date');
      if (error) throw error;
      return data.map(s => ({
        id: s.id, date: s.sale_date, salesType: s.sales_type || 'Local', customer: s.customer || '',
        itemType: s.item_type || 'Full Mass', massId: s.mass_id || '', volumeCBM: s.volume_cbm ?? '',
        rate: s.rate ?? '', paymentReceived: '', note: s.note || ''
      }));
    }
    if (key === KEYS.COLLECTION){
      const { data, error } = await sb.from('sales_collections').select('*').order('coll_date');
      if (error) throw error;
      return data.map(c => ({
        id: c.id, date: c.coll_date, customer: c.customer || '', massId: c.mass_id || '',
        amount: c.amount ?? '', gstAmount: c.gst_amount ?? '', mode: c.payment_mode || 'Cash', note: c.note || ''
      }));
    }
    if (key === KEYS.TARGET){
      const { data: targets, error } = await sb.from('sales_targets').select('*').order('month');
      if (error) throw error;
      const { data: lines, error: lErr } = await sb.from('sales_target_lines').select('*');
      if (lErr) throw lErr;
      return targets.map(t => ({
        id: t.id, month: t.month,
        lines: lines.filter(l=>l.target_id===t.id).map(l=>({ id: l.id, massId: l.mass_id, volumeCBM: l.volume_cbm ?? '', rate: l.rate ?? '' }))
      }));
    }
    return fallback;
  } catch(e){ console.error('load failed', key, e); return fallback; }
}

async function saveKey(key, value){
  try {
    if (key === KEYS.MASTER){
      const { data: existing } = await sb.from('sales_masters').select('type,value');
      const existingSet = new Set((existing||[]).map(r=>r.type+':'+r.value));
      const toInsert = [];
      (value.customers||[]).forEach(v=>{ if(!existingSet.has('customer:'+v)) toInsert.push({type:'customer', value:v}); });
      (value.massIds||[]).forEach(v=>{ if(!existingSet.has('mass_id:'+v)) toInsert.push({type:'mass_id', value:v}); });
      if (toInsert.length){ const { error } = await sb.from('sales_masters').insert(toInsert); if (error) throw error; }
    } else if (key === KEYS.SALES){
      const { error: delErr } = await sb.from('sales_entries').delete().not('id','is',null);
      if (delErr) throw delErr;
      if (value.length){
        const rows = value.map(s=>({
          sale_date: s.date, sales_type: s.salesType||null, customer: s.customer||null, item_type: s.itemType||null,
          mass_id: s.massId||null, volume_cbm: s.volumeCBM||null, rate: s.rate||null, note: s.note||null
        }));
        const { data: inserted, error } = await sb.from('sales_entries').insert(rows).select();
        if (error) throw error;
        inserted.forEach((row,i)=>{ value[i].id = row.id; });
      }
    } else if (key === KEYS.COLLECTION){
      const { error: delErr } = await sb.from('sales_collections').delete().not('id','is',null);
      if (delErr) throw delErr;
      if (value.length){
        const rows = value.map(c=>({
          coll_date: c.date, customer: c.customer||null, mass_id: c.massId || 'Unspecified',
          amount: c.amount||0, gst_amount: c.gstAmount||null, payment_mode: c.mode||null, note: c.note||null
        }));
        const { data: inserted, error } = await sb.from('sales_collections').insert(rows).select();
        if (error) throw error;
        inserted.forEach((row,i)=>{ value[i].id = row.id; });
      }
    } else if (key === KEYS.TARGET){
      const { error: delErr } = await sb.from('sales_targets').delete().not('id','is',null);
      if (delErr) throw delErr;
      for (const t of value){
        const { data: inserted, error } = await sb.from('sales_targets').insert({ month: t.month }).select().single();
        if (error) throw error;
        t.id = inserted.id;
        if (t.lines && t.lines.length){
          const lineRows = t.lines.map(l=>({ target_id: inserted.id, mass_id: l.massId, volume_cbm: l.volumeCBM||null, rate: l.rate||null }));
          const { error: lErr } = await sb.from('sales_target_lines').insert(lineRows);
          if (lErr) throw lErr;
        }
      }
    }
    return true;
  } catch(e){ console.error('save failed', key, e); return false; }
}

// ---------- state ----------
// ================= AUTH =================
let currentUser = null;
let currentRole = null;

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errBox = document.getElementById('loginError');
  errBox.style.display = 'none';
  if (!email || !password){ errBox.textContent = 'Enter email and password.'; errBox.style.display='block'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error){ errBox.textContent = 'Sign in failed — check your email and password.'; errBox.style.display='block'; return; }
  await afterLogin(data.user);
}

async function doLogout(){
  await sb.auth.signOut();
  currentUser = null; currentRole = null;
  document.getElementById('loginScreen').style.display = 'block';
  document.getElementById('userBadge').style.display = 'none';
  document.getElementById('tabBar').style.display = 'none';
  document.getElementById('app').innerHTML = '';
}

async function afterLogin(user){
  currentUser = user;
  const { data: roleRow } = await sb.from('app_user_roles').select('role').eq('user_id', user.id).maybeSingle();
  currentRole = roleRow ? roleRow.role : 'viewer';
  state.role = (currentRole === 'viewer') ? 'Staff' : 'Admin';
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('userBadge').style.display = 'flex';
  document.getElementById('userRoleLabel').textContent = currentRole.toUpperCase() + ' (' + user.email + ')';
  document.getElementById('tabBar').style.display = 'block';
  await init();
}

function showForgotForm(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('forgotScreen').style.display = 'block';
}
function showLoginForm(){
  document.getElementById('forgotScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'block';
}

async function doForgotPassword(){
  const email = document.getElementById('forgotEmail').value.trim();
  const msg = document.getElementById('forgotMsg');
  if (!email){ msg.textContent = 'Enter your email.'; msg.style.color='var(--red)'; msg.style.display='block'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
  if (error){ msg.textContent = 'Error: ' + error.message; msg.style.color='var(--red)'; msg.style.display='block'; return; }
  msg.textContent = 'Reset link sent — check that inbox.'; msg.style.color='#16a34a'; msg.style.display='block';
}

async function doSetNewPassword(){
  const pw = document.getElementById('newPassword').value;
  const msg = document.getElementById('resetMsg');
  if (!pw || pw.length < 6){ msg.textContent = 'Password must be at least 6 characters.'; msg.style.color='var(--red)'; msg.style.display='block'; return; }
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error){ msg.textContent = 'Error: ' + error.message; msg.style.color='var(--red)'; msg.style.display='block'; return; }
  msg.textContent = 'Password updated — you can now use it to sign in.'; msg.style.color='#16a34a'; msg.style.display='block';
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY'){
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('forgotScreen').style.display = 'none';
    document.getElementById('resetScreen').style.display = 'block';
  }
});

async function checkExistingSession(){
  const { data } = await sb.auth.getSession();
  if (data && data.session && data.session.user){
    await afterLogin(data.session.user);
  }
}
checkExistingSession();

let state = {
  role: 'Staff',
  tab: 'sales',
  month: new Date().toISOString().slice(0,7),
  master: { customers: [], massIds: [] },
  sales: [],
  collections: [],
  targets: [], // [{month, targetVolume, targetRevenue}]
  productionMassTargets: [], // read-only view into the Production app's Mass Targets — same Supabase project, different key
  loading: true,
};
const PRODUCTION_MASSTARGETS_KEY = 'lite-prod-masstargets-v1';
let showProdMasses = false;

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
const monthOf = d => (d||'').slice(0,7);
const fmtINR = n => '\u20B9' + Number(n||0).toLocaleString('en-IN', {maximumFractionDigits:2});
// Indian-style compact format for larger rupee figures — Crore/Lakh, never "Millions".
function fmtINRCr(n){
  n = Number(n)||0;
  const abs = Math.abs(n);
  if (abs >= 10000000) return '\u20B9' + (n/10000000).toLocaleString('en-IN',{maximumFractionDigits:2}) + ' Cr';
  if (abs >= 100000) return '\u20B9' + (n/100000).toLocaleString('en-IN',{maximumFractionDigits:2}) + ' L';
  return fmtINR(n);
}
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOCAL_RATE = 24000;

// Collections is the single source of truth for money received. A sale's "paid" total
// is always computed from linked Collection entries, never stored on the sale itself.
const paidOf = (sale) => state.collections.filter(c=>c.linkedSaleId===sale.id).reduce((s,c)=>s+(Number(c.amount)||0),0);
const dueOf = (sale) => (Number(sale.saleValue)||0) - paidOf(sale);

function flash(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>{ t.style.display='none'; }, 2000);
}

async function init(){
  state.master = await loadKey(KEYS.MASTER, { customers: [], massIds: [] });
  state.sales = await loadKey(KEYS.SALES, []);
  state.collections = await loadKey(KEYS.COLLECTION, []);
  state.targets = await loadKey(KEYS.TARGET, []);
  state.productionMassTargets = await loadKey(PRODUCTION_MASSTARGETS_KEY, []);
  state.loading = false;
  document.getElementById('monthPicker').value = state.month;
  render();
}
// init() now only runs after a successful login — see afterLogin() above

async function refreshProdMasses(){
  state.productionMassTargets = await loadKey(PRODUCTION_MASSTARGETS_KEY, []);
  showProdMasses = true;
  render();
}
function toggleProdMasses(){
  if (showProdMasses){ showProdMasses = false; render(); }
  else { refreshProdMasses(); }
}

function setRole(r){ state.role = r; state.editingId = null; render(); }
function setTab(t){ state.tab = t; render(); }
function setMonth(m){ state.month = m; render(); }

// ---- Flexible report period: either "this month" or a custom date range — used by
// Sales and Collections tables/downloads, independently of the global month picker above.
function lastDayOfMonth(m){
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo, 0).getDate();
}
function monthBounds(m){
  return { from: m + '-01', to: `${m}-${String(lastDayOfMonth(m)).padStart(2,'0')}` };
}
let salesPeriod = { mode:'month', month: state.month, from:'', to:'' };
let collPeriod = { mode:'month', month: state.month, from:'', to:'' };
function resolvePeriod(period){
  if (period.mode==='range' && period.from){
    return { from: period.from, to: period.to || period.from };
  }
  return monthBounds(period.month || state.month);
}
function setSalesPeriod(field, val){ salesPeriod = { ...salesPeriod, [field]: val }; renderSalesTab(); }
function setCollPeriod(field, val){ collPeriod = { ...collPeriod, [field]: val }; renderCollectionTab(); }
function renderPeriodPicker(period, setterName){
  const b = resolvePeriod(period);
  return `
  <div class="subcard">
    <div class="pill-row" style="margin-bottom:8px;">
      <button class="pill ${period.mode==='month'?'active amber':''}" onclick="${setterName}('mode','month')">By Month</button>

async function addCustomer(name){

  state.master.customers = [...state.master.customers, name];
  await saveKey(KEYS.MASTER, state.master);
}
async function addMassId(id){

  state.master.massIds = [...state.master.massIds, id];
  await saveKey(KEYS.MASTER, state.master);
}
function refreshDatalists(){

// ================= TARGET (simple, per-month) =================
let targetLineDraft = null; // { id, massId, volumeCBM, rate } while adding/editing a line
function getTarget(month){ return state.targets.find(t=>t.month===month); }
function targetLinesOf(month){ const t = getTarget(month); return (t && t.lines) || []; }

function blankTargetLine(){ return { id:null, massId:'', volumeCBM:'', rate:LOCAL_RATE }; }
function openTargetLineForm(lineId){
  if (lineId){
    const line = targetLinesOf(state.month).find(l=>l.id===lineId);
    targetLineDraft = line ? { ...line } : blankTargetLine();
  } else {
    targetLineDraft = blankTargetLine();
  }
  renderSalesTab();
}
function closeTargetLineForm(){ targetLineDraft = null; renderSalesTab(); }
function updateTargetLineRevenuePreview(){
  const el = document.getElementById('targetLineRevenuePreview');
  if (el) el.value = fmtINR((Number(targetLineDraft.volumeCBM)||0) * (Number(targetLineDraft.rate)||0));
}
async function submitTargetLine(){
  const d = targetLineDraft;
  if (!d.massId || !d.volumeCBM){ alert('Please fill Mass ID and Volume.'); return; }
  const rec = { id: d.id || uid(), massId: d.massId, volumeCBM: Number(d.volumeCBM), rate: Number(d.rate)||LOCAL_RATE };
  let target = getTarget(state.month);
  if (!target){ target = { id: uid(), month: state.month, lines: [] }; state.targets.push(target); }
  if (d.id){ target.lines = target.lines.map(l=>l.id===d.id ? rec : l); }
  else { target.lines = [...(target.lines||[]), rec]; }
  await saveKey(KEYS.TARGET, state.targets);
  await addMassId(d.massId);
  targetLineDraft = null;
  flash('Target line saved');
  renderSalesTab();
}
async function deleteTargetLine(lineId){
  const target = getTarget(state.month);
  if (!target) return;
  target.lines = (target.lines||[]).filter(l=>l.id!==lineId);
  await saveKey(KEYS.TARGET, state.targets);
  flash('Target line removed');
  renderSalesTab();
}

function renderTargetLineForm(){
  const d = targetLineDraft;
  const revenue = (Number(d.volumeCBM)||0) * (Number(d.rate)||0);
  return `
  <div class="subcard" style="border-color:var(--amber);margin-bottom:12px;">
    <div class="subtitle">${d.id ? 'Edit target line' : 'Add target line'}</div>
    <div class="grid">
      <label><span class="lbl">Mass ID</span><input list="massIdList" value="${esc(d.massId)}" onchange="targetLineDraft.massId=this.value" placeholder="e.g. E 9"></label>
      <label><span class="lbl">Volume (CBM)</span><input type="number" step="any" value="${esc(d.volumeCBM)}" oninput="targetLineDraft.volumeCBM=this.value; updateTargetLineRevenuePreview();"></label>
      <label><span class="lbl">Rate (₹/CBM) — defaults to Local, override for Export</span><input type="number" step="any" value="${esc(d.rate)}" oninput="targetLineDraft.rate=this.value; updateTargetLineRevenuePreview();"></label>
      <label><span class="lbl">Revenue (auto)</span><input id="targetLineRevenuePreview" value="${fmtINR(revenue)}" disabled style="background:#f5f5f4;font-family:ui-monospace,monospace;"></label>
    </div>
    <button class="btn amber" onclick="submitTargetLine()">${d.id ? 'Save changes' : 'Add line'}</button>
    <button class="btn ghost" onclick="closeTargetLineForm()">Cancel</button>
  </div>`;
}

function computeUnplannedSales(monthSales, lines){
  const targetedMassIds = new Set(lines.map(l=>l.massId));
  const groups = {};
  monthSales.filter(s=>!targetedMassIds.has(s.massId)).forEach(s=>{
    const key = s.massId || '(no Mass ID)';
    if (!groups[key]) groups[key] = { massId: key, vol:0, rev:0 };
    groups[key].vol += Number(s.volumeCBM)||0;
    groups[key].rev += Number(s.saleValue)||0;
  });
  return Object.values(groups);
}

function renderTargetCard(monthSales){
  const lines = targetLinesOf(state.month);
  const targetVol = lines.reduce((a,l)=>a+(Number(l.volumeCBM)||0),0);
  const targetRev = lines.reduce((a,l)=>a+(Number(l.volumeCBM)||0)*(Number(l.rate)||0),0);
  const achievedVol = monthSales.reduce((a,s)=>a+(Number(s.volumeCBM)||0),0);
  const achievedRev = monthSales.reduce((a,s)=>a+(Number(s.saleValue)||0),0);
  const balVol = Math.max(targetVol - achievedVol, 0);
  const balRev = Math.max(targetRev - achievedRev, 0);

  let html = `
  <div class="card">
    <p class="section-title">Sales Target — Mass-wise</p>
    <div class="stat-row" style="margin-bottom:12px;">

      <div class="stat amber"><div class="lbl">Achieved Volume</div><div class="val">${achievedVol.toLocaleString('en-IN')} CBM</div></div>
      <div class="stat ${balVol>0?'red':'emerald'}"><div class="lbl">Balance Volume</div><div class="val">${balVol.toLocaleString('en-IN')} CBM</div></div>
      <div class="stat stone"><div class="lbl">&nbsp;</div><div class="val">&nbsp;</div></div>
      <div class="stat teal"><div class="lbl">Target Revenue</div><div class="val">${fmtINRCr(targetRev)}</div></div>
      <div class="stat amber"><div class="lbl">Achieved Revenue</div><div class="val">${fmtINRCr(achievedRev)}</div></div>
      <div class="stat ${balRev>0?'red':'emerald'}"><div class="lbl">Balance Revenue</div><div class="val">${fmtINRCr(balRev)}</div></div>
      <div class="stat stone"><div class="lbl">&nbsp;</div><div class="val">&nbsp;</div></div>
    </div>`;

  if (targetLineDraft){
    html += renderTargetLineForm();
  } else {
    html += `<button class="btn amber" onclick="openTargetLineForm(null)" style="margin-bottom:12px;">+ Add target line</button>`;
  }

  html += `<div class="table-wrap"><table><thead><tr>
    <th>Mass ID</th><th style="text-align:right;">Target Vol</th><th style="text-align:right;">Rate</th><th style="text-align:right;">Target Rev</th>
    <th style="text-align:right;">Sold Vol</th><th style="text-align:right;">Sold Rev</th><th style="text-align:right;">Vol Balance</th><th style="text-align:right;">Rev Balance</th><th></th>
    </tr></thead><tbody>`;
  const unplanned = computeUnplannedSales(monthSales, lines);
  if (lines.length===0 && unplanned.length===0){
    html += `<tr><td colspan="9" class="empty">No masses targeted for sales yet this month.</td></tr>`;
  } else {
    lines.forEach(l=>{
      const targetRevLine = (Number(l.volumeCBM)||0)*(Number(l.rate)||0);
      const matchedSales = monthSales.filter(s=>s.massId===l.massId);
      const sold = matchedSales.reduce((a,s)=>a+(Number(s.volumeCBM)||0),0);
      const soldRev = matchedSales.reduce((a,s)=>a+(Number(s.saleValue)||0),0);
      const bal = (Number(l.volumeCBM)||0) - sold;
      const revBal = targetRevLine - soldRev;
      html += `<tr>
        <td style="font-family:ui-monospace,monospace;">${esc(l.massId)}</td>
        <td class="num">${l.volumeCBM}</td>
        <td class="num">₹${Number(l.rate).toLocaleString('en-IN')}</td>

      const sumTargetRev = lines.reduce((a,l)=>a+(Number(l.volumeCBM)||0)*(Number(l.rate)||0),0);
      const sumSoldVol = lines.reduce((a,l)=>a+monthSales.filter(s=>s.massId===l.massId).reduce((x,s)=>x+(Number(s.volumeCBM)||0),0),0);

        <td></td>
      </tr>`;

  }
  html += `</tbody></table></div>`;
  if (unplanned.length > 0){
    html += `<p class="hint">"Unplanned" rows are sales for a Mass ID that has no target line set up — nothing here is ever silently uncounted; add a target line for that Mass ID if you want it tracked against a plan.</p>`;
  }

  html += `<button class="btn ghost" onclick="toggleProdMasses()" style="margin-top:12px;">${showProdMasses ? 'Hide' : '🏭 Show'} Targeted Masses (Production) — ${esc(state.month)}</button>

function setSaleType(t){ saleForm.salesType = t; saleForm.rate = t==='Local' ? LOCAL_RATE : ''; renderSalesTab(); }
function setSaleItem(t){ saleForm.itemType = t; renderSalesTab(); }
function linkedNoteFor(sale){ return `${sale.itemType}${sale.massId ? ' '+sale.massId : ''}`; }

async function submitSale(){
  const f = saleForm;
  if (!f.date || !f.salesType || !f.customer || !f.volumeCBM || !f.rate){ alert('Please fill date, type, customer, volume and rate.'); return; }
  if (f.itemType !== 'Loose Blocks' && !f.massId){ alert('Please enter the Mass ID.'); return; }
  const saleValue = (Number(f.volumeCBM)||0) * (Number(f.rate)||0);
  const newPaid = Number(f.paymentReceived)||0;
  const { paymentReceived, ...rest } = f;
  const rec = { ...rest, saleValue, volumeCBM:Number(f.volumeCBM), rate:Number(f.rate), month: monthOf(f.date) };

  let saleId = f.id;
  if (f.id){
    const existing = state.sales.find(s=>s.id===f.id);
    state.sales = state.sales.map(s => s.id===f.id ? { ...s, ...rec, editedBy: state.role } : s);
    await saveKey(KEYS.SALES, state.sales);
    // Reconcile payment only if the entered total actually changed — replace this sale's
    // linked collections with one corrected entry, leaving unrelated collections untouched.
    const currentPaid = paidOf(existing);
    if (newPaid !== currentPaid){
      const withoutThisSale = state.collections.filter(c=>c.linkedSaleId!==f.id);
      const nextColl = newPaid > 0
        ? [{ id: uid(), date: today(), customer: rec.customer, amount: newPaid, mode:'—', note:'', month: monthOf(today()), linkedSaleId: f.id, linkedNote: linkedNoteFor(rec) }, ...withoutThisSale]
        : withoutThisSale;
      state.collections = nextColl;
      await saveKey(KEYS.COLLECTION, state.collections);
    }
  } else {
    saleId = uid();
    rec.id = saleId; rec.createdBy = state.role;
    state.sales = [...state.sales, rec];
    await saveKey(KEYS.SALES, state.sales);

function blankColl(){ return { id:null, date:today(), customer:'', amount:'', gstAmount:'', mode:'Cash', note:'' }; }
let collForm = blankColl();
const MODES = ['Cash','Bank Transfer','Cheque','UPI'];

// Running, cumulative-per-customer figures as of a given collection row's date.
function computeCollectionLedgerRow(c){
  const cumSalesValue = state.sales.filter(s => s.customer===c.customer && s.date <= c.date).reduce((a,s)=>a+(Number(s.saleValue)||0),0);
  const cumGST = state.collections.filter(x => x.customer===c.customer && x.date <= c.date).reduce((a,x)=>a+(Number(x.gstAmount)||0),0);
  const totalDue = cumSalesValue + cumGST;
  const cumPayments = state.collections.filter(x => x.customer===c.customer && x.date <= c.date).reduce((a,x)=>a+(Number(x.amount)||0),0);
  const balanceDue = totalDue - cumPayments;
  return { cumSalesValue, cumGST, totalDue, cumPayments, balanceDue };
}

async function downloadCollectionImage(){

  try {

    const pb = resolvePeriod(collPeriod);
    const link = document.createElement('a');
    link.download = `VKG_Collections_${pb.from}_to_${pb.to}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    flash('Collections image downloaded');
  } catch(e){ console.error(e); alert('Could not generate the image — please try again.'); }
}
async function downloadCollectionPDF(){
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){ alert('PDF export library did not load — check your internet connection and try again.'); return; }
  const el = document.getElementById('collectionCaptureFull');
  if (!el){ alert('Nothing to capture yet.'); return; }
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2 });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/png');
    let heightLeft = imgHeight, position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    const pb = resolvePeriod(collPeriod);
    pdf.save(`VKG_Collections_${pb.from}_to_${pb.to}.pdf`);
    flash('Collections PDF downloaded');
  } catch(e){ console.error(e); alert('Could not generate the PDF — please try again.'); }
}
function downloadCollectionExcel(){

  const pb = resolvePeriod(collPeriod);
  const periodColl = state.collections.filter(c=>c.date>=pb.from && c.date<=pb.to);

    const ledger = computeCollectionLedgerRow(c);
    return {

    };
  });
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Collections');
  XLSX.writeFile(wb, `VKG_Collections_${pb.from}_to_${pb.to}.xlsx`);
  flash('Collections Excel downloaded');
}

    }
    unplannedExport.forEach(u=>{
      tRows += `<tr style="background:#fffbeb;"><td style="padding:7px 10px;font-weight:600;">${esc(u.massId)} <span style="background:#fef3c7;color:${AMBER};border-radius:999px;padding:1px 8px;font-size:10px;">Unplanned</span></td><td style="padding:7px 10px;text-align:right;color:#a8a29e;">—</td><td style="padding:7px 10px;text-align:right;color:#a8a29e;">—</td><td style="padding:7px 10px;text-align:right;">${u.vol.toLocaleString('en-IN')}</td><td style="padding:7px 10px;text-align:right;color:${EMERALD};">${fmtINRCr(u.rev)}</td><td style="padding:7px 10px;text-align:right;color:#a8a29e;">—</td><td style="padding:7px 10px;text-align:right;color:#a8a29e;">—</td></tr>`;
    });
  }
  inner += dashTable([{label:'Mass ID'},{label:'Target Vol',right:1},{label:'Target Rev',right:1},{label:'Sold Vol',right:1},{label:'Sold Rev',right:1},{label:'Vol Bal',right:1},{label:'Rev Bal',right:1}], tRows, AMBER);

  inner += dashHeader(`Today's Sales — ${todayStr}`, TEAL);
  let todayRows = '';
  if (todaySales.length===0){ todayRows = `<tr><td colspan="5" style="text-align:center;color:#a8a29e;padding:10px;">No sales logged today yet.</td></tr>`; }
  else { todaySales.forEach((s,i)=>{ todayRows += `<tr style="background:${i%2?'#fafaf9':'#fff'};"><td style="padding:7px 10px;">${esc(s.customer)}</td><td style="padding:7px 10px;">${esc(s.itemType)}</td><td style="padding:7px 10px;text-align:right;">${s.volumeCBM}</td><td style="padding:7px 10px;text-align:right;">${fmtINR(s.saleValue)}</td><td style="padding:7px 10px;text-align:right;color:${EMERALD};">${fmtINR(paidOf(s))}</td></tr>`; }); }
  inner += dashTable([{label:'Customer'},{label:'Item'},{label:'Vol',right:1},{label:'Value',right:1},{label:'Paid',right:1}], todayRows, TEAL);

  inner += dashHeader(`Confirmed Sales — ${pb.from} to ${pb.to} (${periodSales.length})`, AMBER);
  let salesRowsHtml = '';
  if (periodSales.length===0){ salesRowsHtml = `<tr><td colspan="7" style="text-align:center;color:#a8a29e;padding:10px;">No sales in this period.</td></tr>`; }
  else { periodSales.forEach((s,i)=>{ const paid=paidOf(s); const due=dueOf(s); salesRowsHtml += `<tr style="background:${i%2?'#fafaf9':'#fff'};"><td style="padding:7px 10px;">${esc(s.date)}</td><td style="padding:7px 10px;">${esc(s.customer)}</td><td style="padding:7px 10px;">${esc(s.itemType)}</td><td style="padding:7px 10px;text-align:right;">${s.volumeCBM}</td><td style="padding:7px 10px;text-align:right;">${fmtINR(s.saleValue)}</td><td style="padding:7px 10px;text-align:right;color:${EMERALD};">${fmtINR(paid)}</td><td style="padding:7px 10px;text-align:right;font-weight:600;color:${due>0?RED:EMERALD};">${fmtINR(due)}</td></tr>`; }); }
  inner += dashTable([{label:'Date'},{label:'Customer'},{label:'Item'},{label:'Vol',right:1},{label:'Value',right:1},{label:'Paid',right:1},{label:'Due',right:1}], salesRowsHtml, AMBER);



  return `<div id="summaryCaptureFull" style="position:absolute;left:-9999px;top:0;width:820px;background:#fafaf9;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1c1917;">${inner}</div>`;
}

async function downloadSummaryImage(){
  if (typeof html2canvas === 'undefined'){ alert('Image export library did not load — check your internet connection and try again.'); return; }
  const el = document.getElementById('summaryCaptureFull');
  if (!el){ alert('Nothing to capture yet.'); return; }
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2 });
    const link = document.createElement('a');
    link.download = `VKG_Sales_Summary_${resolvePeriod(salesPeriod).from}_to_${resolvePeriod(salesPeriod).to}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    flash('Summary image downloaded');
  } catch(e){ console.error(e); alert('Could not generate the image — please try again.'); }
}

async function downloadSummaryPDF(){
  if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined'){ alert('PDF export library did not load — check your internet connection and try again.'); return; }
  const el = document.getElementById('summaryCaptureFull');
  if (!el){ alert('Nothing to capture yet.'); return; }
  try {
    const canvas = await html2canvas(el, { backgroundColor: '#ffffff', scale: 2 });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = (canvas.height * imgWidth) / canvas.width;
    const imgData = canvas.toDataURL('image/png');

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while (heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }
    pdf.save(`VKG_Sales_Summary_${resolvePeriod(salesPeriod).from}_to_${resolvePeriod(salesPeriod).to}.pdf`);
    flash('Summary PDF downloaded');
  } catch(e){ console.error(e); alert('Could not generate the PDF — please try again.'); }
}

function downloadExcel(){
  if (typeof XLSX === 'undefined'){ alert('Excel export library did not load — check your internet connection and try again.'); return; }
  const pb = resolvePeriod(salesPeriod);
  const monthSales = state.sales.filter(s=>s.date>=pb.from && s.date<=pb.to);
  const monthColl = state.collections.filter(c=>c.date>=pb.from && c.date<=pb.to);

  const salesRows = monthSales.map(s=>{
    const paid = paidOf(s);
    const due = dueOf(s);
    return {
      'Date': s.date, 'Type': s.salesType, 'Customer': s.customer, 'Item': s.itemType, 'Mass ID': s.massId||'',
      'Volume (CBM)': s.volumeCBM, 'Rate': s.rate, 'Sale Value': s.saleValue, 'Paid': paid, 'Due': due, 'Note': s.note||''
    };
  });
  const salesTargetRows = targetLinesOf(state.month).map(l=>{
    const targetRevLine = (Number(l.volumeCBM)||0)*(Number(l.rate)||0);
    const matched = monthSales.filter(s=>s.massId===l.massId);
    const sold = matched.reduce((a,s)=>a+(Number(s.volumeCBM)||0),0);
    const soldRev = matched.reduce((a,s)=>a+(Number(s.saleValue)||0),0);
    return {
      'Mass ID': l.massId, 'Target Volume (CBM)': l.volumeCBM, 'Rate': l.rate,
      'Target Revenue': targetRevLine,
      'Sold Volume (CBM)': sold, 'Sold Revenue': soldRev,
      'Volume Balance (CBM)': (Number(l.volumeCBM)||0) - sold, 'Revenue Balance': targetRevLine - soldRev
    };
  });
  if (salesTargetRows.length > 0){
    const sum = (key) => salesTargetRows.reduce((a,r)=>a+(Number(r[key])||0),0);
    salesTargetRows.push({
      'Mass ID': 'TOTAL', 'Target Volume (CBM)': sum('Target Volume (CBM)'), 'Rate': '',
      'Target Revenue': sum('Target Revenue'),
      'Sold Volume (CBM)': sum('Sold Volume (CBM)'), 'Sold Revenue': sum('Sold Revenue'),
      'Volume Balance (CBM)': sum('Volume Balance (CBM)'), 'Revenue Balance': sum('Revenue Balance')
    });
  }
  computeUnplannedSales(monthSales, targetLinesOf(state.month)).forEach(u=>{
    salesTargetRows.push({
      'Mass ID': `${u.massId} (Unplanned)`, 'Target Volume (CBM)': '', 'Rate': '',
      'Target Revenue': '', 'Sold Volume (CBM)': u.vol, 'Sold Revenue': u.rev,
      'Volume Balance (CBM)': '', 'Revenue Balance': ''
    });
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesRows), 'Sales');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salesTargetRows), 'Sales Target (Mass-wise)');
  XLSX.writeFile(wb, `VKG_Sales_${pb.from}_to_${pb.to}.xlsx`);
  flash('Excel downloaded');
}

function renderCustomerSummaryTab(){
  const byCustomer = {};
  state.sales.forEach(s=>{
    const c = s.customer || '(no customer)';
    if (!byCustomer[c]) byCustomer[c] = { customer:c, vol:0, salesValue:0, collected:0 };
    byCustomer[c].vol += Number(s.volumeCBM)||0;
    byCustomer[c].salesValue += Number(s.saleValue)||0;
  });
  state.collections.forEach(c=>{
    const name = c.customer || '(no customer)';
    if (!byCustomer[name]) byCustomer[name] = { customer:name, vol:0, salesValue:0, collected:0 };
    byCustomer[name].collected += Number(c.amount)||0;
  });
  const rows = Object.values(byCustomer).sort((a,b)=>b.salesValue-a.salesValue);
  const totalVol = rows.reduce((a,r)=>a+r.vol,0);
  const totalSales = rows.reduce((a,r)=>a+r.salesValue,0);
  const totalColl = rows.reduce((a,r)=>a+r.collected,0);

  let html = `
    <p class="section-title">Customer Summary — All Time (first recorded month through today)</p>
    <div class="stat-row">
      <div class="stat amber"><div class="lbl">Total Volume</div><div class="val">${totalVol.toLocaleString('en-IN')} CBM</div></div>
      <div class="stat teal"><div class="lbl">Total Sales Value</div><div class="val">${fmtINRCr(totalSales)}</div></div>
      <div class="stat emerald"><div class="lbl">Total Collections</div><div class="val">${fmtINRCr(totalColl)}</div></div>
    </div>
    <div class="table-wrap"><table><thead><tr>
      <th>Customer Name</th><th style="text-align:right;">Total Volume (CBM)</th><th style="text-align:right;">Total Sales Value</th><th style="text-align:right;">Total Collections</th>
    </tr></thead><tbody>`;
  if (rows.length===0){
    html += `<tr><td colspan="4" class="empty">No customers recorded yet.</td></tr>`;
  } else {
    rows.forEach(r=>{
      html += `<tr>
        <td>${esc(r.customer)}</td>
        <td class="num">${r.vol.toLocaleString('en-IN')}</td>
        <td class="num">${fmtINR(r.salesValue)}</td>
        <td class="num" style="color:var(--emerald);">${fmtINR(r.collected)}</td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>
  <p class="hint">This customer table always reflects every month you've ever recorded — it ignores the month picker above.</p>`;

  const byMonth = {};
  state.sales.forEach(s=>{
    const m = s.month || monthOf(s.date);
    if (!byMonth[m]) byMonth[m] = { month:m, vol:0, salesValue:0, collected:0 };
    byMonth[m].vol += Number(s.volumeCBM)||0;
    byMonth[m].salesValue += Number(s.saleValue)||0;
  });
  state.collections.forEach(c=>{
    const m = c.month || monthOf(c.date);
    if (!byMonth[m]) byMonth[m] = { month:m, vol:0, salesValue:0, collected:0 };
    byMonth[m].collected += Number(c.amount)||0;
  });
  const monthRows = Object.values(byMonth).sort((a,b)=>a.month.localeCompare(b.month));

  html += `<p class="section-title" style="margin-top:24px;">Month-wise Breakdown</p>
    <div class="table-wrap"><table><thead><tr>
      <th>Month</th><th style="text-align:right;">Volume (CBM)</th><th style="text-align:right;">Sales Value</th><th style="text-align:right;">Collections</th>
    </tr></thead><tbody>`;
  if (monthRows.length===0){
    html += `<tr><td colspan="4" class="empty">No data recorded yet.</td></tr>`;
  } else {
    monthRows.forEach(r=>{
      html += `<tr>
        <td>${esc(r.month)}</td>
        <td class="num">${r.vol.toLocaleString('en-IN')}</td>
        <td class="num">${fmtINR(r.salesValue)}</td>
        <td class="num" style="color:var(--emerald);">${fmtINR(r.collected)}</td>
      </tr>`;
    });
  }
  html += `</tbody></table></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
    <button class="btn teal" onclick="downloadCustomerSummaryExcel()">⬇ Download Excel</button>
  </div>`;
  document.getElementById('app').innerHTML = html;
  refreshDatalists();
}
